server:
  port: 8080

spring:
  application:
    name: backend

  # Supabase PostgreSQL 연결
  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USER}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update        # 개발 중: update | 운영: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

# Swagger / SpringDoc
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

# Supabase 설정
supabase:
  url: ${SUPABASE_URL}
  anon-key: ${SUPABASE_ANON_KEY}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY}   # Admin API 호출용

# 사번 이메일 도메인 (mes001@[domain] 형식으로 Supabase Auth에 등록)
app:
  emp-email-domain: ${EMP_EMAIL_DOMAIN:mes.local}
