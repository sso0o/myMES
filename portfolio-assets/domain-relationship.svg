<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360" role="img" aria-labelledby="title desc">
  <title id="title">myMES 주요 도메인 관계도</title>
  <desc id="desc">품목, 공정, 설비, BOM, 생산계획, 작업지시, 생산실적, 품질검사, 불량기록의 주요 관계</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M1 1 L9 5.5 L1 10 Z" fill="#111111"/>
    </marker>
    <marker id="arrow-mid" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M1 1 L9 5.5 L1 10 Z" fill="#666666"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .band { fill: #f5f5f5; stroke: #d0d0d0; stroke-width: 1.5; }
      .label { fill: #777777; font: 700 12px "JetBrains Mono", "SFMono-Regular", Consolas, monospace; letter-spacing: 1px; }
      .box { fill: #ffffff; stroke: #111111; stroke-width: 2; }
      .box-soft { fill: #ffffff; stroke: #d0d0d0; stroke-width: 2; }
      .box-dark { fill: #111111; stroke: #111111; stroke-width: 2; }
      .title { fill: #111111; font: 700 18px "Noto Sans KR", "Apple SD Gothic Neo", Arial, sans-serif; }
      .title-white { fill: #ffffff; font: 700 18px "Noto Sans KR", "Apple SD Gothic Neo", Arial, sans-serif; }
      .meta { fill: #555555; font: 500 12px "JetBrains Mono", "SFMono-Regular", Consolas, monospace; }
      .meta-white { fill: #dddddd; font: 500 12px "JetBrains Mono", "SFMono-Regular", Consolas, monospace; }
      .small { fill: #666666; font: 400 12px "Noto Sans KR", "Apple SD Gothic Neo", Arial, sans-serif; }
      .line { fill: none; stroke: #111111; stroke-width: 2.2; marker-end: url(#arrow); }
      .line-mid { fill: none; stroke: #666666; stroke-width: 1.8; marker-end: url(#arrow-mid); }
      .line-dashed { fill: none; stroke: #666666; stroke-width: 1.8; stroke-dasharray: 7 7; marker-end: url(#arrow-mid); }
      .tag { fill: #eeeeee; stroke: #d0d0d0; stroke-width: 1; }
      .tag-text { fill: #333333; font: 600 11px "Noto Sans KR", "Apple SD Gothic Neo", Arial, sans-serif; }
    </style>
