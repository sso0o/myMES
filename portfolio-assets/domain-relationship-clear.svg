      .line { fill: none; stroke: #111111; stroke-width: 3; marker-end: url(#arrow); }
      .line-soft { fill: none; stroke: #666666; stroke-width: 2.4; marker-end: url(#arrow-soft); }
      .line-dashed { fill: none; stroke: #666666; stroke-width: 2.2; stroke-dasharray: 8 8; marker-end: url(#arrow-soft); }
      .note { fill: #ffffff; stroke: #d0d0d0; stroke-width: 1; }
